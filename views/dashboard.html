<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Manager - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/public/css/dashboard.css">

    <!-- Add before your existing scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="/firebase-config.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-home"></i>
                <span>Tenant Manager</span>
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search tenant..." id="search-input">
                </div>
                <div class="icon-btn" id="menu-btn">
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="section-title">
                <div>My Tenants</div>
                <button class="btn btn-primary" id="add-tenant-btn">
                    <i class="fas fa-plus"></i> Add New Tenant
                </button>
            </div>
            
            <div class="tenant-grid" id="tenant-grid">
                <!-- Tenant cards will be populated here -->
            </div>
        </main>
    </div>
    <script src="/public/js/dashboard.js"></script>
</body>
</html>
