<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Secure Auth System</title>
  <link rel="stylesheet" href="/public/css/signup.css">
      <!-- Add Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="/firebase-config.js"></script>

</head>
<body>
  <div class="container">
    <h1>Sign Up</h1>
    <div id="signup-alert" class="alert"></div>
    <form id="signupForm">
      <div class="form-group">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" class="form-input" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" class="form-input" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="password-container">
          <input type="password" id="signup-password" class="form-input" required placeholder="Create a password">
          <span class="toggle-password" data-target="signup-password">👁️</span>
        </div>
        <div class="password-strength">
          <div class="password-strength-meter" id="password-strength-meter"></div>
        </div>
        <div class="password-hints">
          <p>Password must contain:</p>
          <ul>
            <li id="length-requirement">At least 8 characters</li>
            <li id="number-requirement">At least one number</li>
            <li id="uppercase-requirement">At least one uppercase letter</li>
            <li id="special-requirement">At least one special character</li>
          </ul>
        </div>
      </div>
      <button type="submit" class="btn" id="signup-button" disabled>
        <span class="spinner" id="signup-spinner"></span>
        <span>Sign Up</span>
      </button>
    </form>
    <div class="link-text">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>  
  <script src="/public/js/signup.js"></script>
</body>
</html>
