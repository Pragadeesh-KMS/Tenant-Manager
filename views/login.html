<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Manager - Login</title>
    <link rel="stylesheet" href="/public/css/login.css">
    <!-- Add before your existing scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="/firebase-config.js"></script>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Tenant Manager</h1>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                <div class="error-message" id="email-error">Please enter a valid email</div>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="8">
                <div class="error-message" id="password-error">Password must be at least 8 characters</div>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
            <div class="link-text">
                New user? <a href="signup.html">Sign Up</a>
            </div>
        </form>
    </div>        
    <script src="/public/js/login.js"></script>
</body>
</html>
